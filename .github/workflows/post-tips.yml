name: Post AI Tips to Slack

on:
  schedule:
    # テスト用: 22:05 JST (13:05 UTC)
    - cron: '5 13 * * *'
    # # 毎日 9:00 JST (00:00 UTC) - エンジニア向け
    # - cron: '0 0 * * *'
    # # 毎日 12:00 JST (03:00 UTC) - コンサルタント向け
    # - cron: '0 3 * * *'
    # # 毎日 18:00 JST (09:00 UTC) - バックオフィス向け
    # - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'カテゴリ指定（空欄でランダム）'
        required: false
        type: choice
        options:
          - ''
          - engineer
          - consultant
          - backoffice

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine category from schedule
        id: category
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "00" ]; then
            echo "value=engineer" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "03" ]; then
            echo "value=consultant" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "09" ]; then
            echo "value=backoffice" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      - name: Post tips
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CATEGORY: ${{ github.event.inputs.category || steps.category.outputs.value }}
        run: python src/main.py
