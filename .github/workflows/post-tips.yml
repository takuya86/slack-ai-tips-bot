name: Post AI Tips to Slack

on:
  repository_dispatch:
    types: [post-tips]
  workflow_dispatch:
    inputs:
      category:
        description: 'カテゴリ指定（空欄でランダム）'
        required: false
        type: choice
        options:
          - ''
          - engineer
          - consultant
          - backoffice

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone data repo
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
          GIT_LFS_SKIP_SMUDGE: 1
        run: |
          git clone --depth 1 "https://$GH_TOKEN@github.com/takuya86/obsidian-sns-data.git" data-repo

      - name: Post tips
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CATEGORY: ${{ github.event.client_payload.category || github.event.inputs.category }}
          DATA_REPO_PATH: data-repo/ai-tips
        run: python src/main.py

      - name: Commit used_count update
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        run: |
          cd data-repo
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update: Tips使用回数を更新"
          git push
